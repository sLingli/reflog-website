<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefLog - Professional Match Timer</title>
    <style>
        body {
            
            background: linear-gradient(-45deg, #000000, #0a3d25, #000000, #052618);
            background-size: 400% 400%;
            animation: gradientFlow 12s ease infinite; 
            
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
            padding: 0 20px;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lang-switch {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .lang-switch:hover {
            border-color: #00FF85;
            color: #00FF85;
            background: rgba(0, 255, 133, 0.1);
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
            z-index: 10;
        }

        .app-icon {
            width: 140px;
            height: 140px;
            background-color: #ffffff;
            border-radius: 35px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 50px rgba(0, 255, 133, 0.15); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .logo-text {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            user-select: none;
            transition: all 0.5s ease;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .text-ref { color: #00FF85; }
        
        .text-eree { 
            color: #555555; 
            font-weight: 600; 
        } 
        
        .text-log { color: #ffffff; margin-left: 15px; }

        .content-wrapper {
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            z-index: 10;
        }

        .fade-out { opacity: 0; }

        .title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
            font-weight: 300;
            line-height: 1.5;
        }

        .download-btn {
            background: #00FF85;
            color: #000;
            text-decoration: none;
            padding: 15px 0;
            width: 280px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 50px;
            border: 2px solid #00FF85;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1rem;
            backdrop-filter: blur(5px);
            margin-bottom: 15px;
        }
        .download-btn:hover {
            background: #00cc6a;
            border-color: #00cc6a;
            box-shadow: 0 0 30px rgba(0, 255, 133, 0.5);
        }

        .github-btn {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            text-decoration: none;
            padding: 15px 0;
            width: 280px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 50px;
            border: 2px solid #555;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1rem;
            backdrop-filter: blur(5px);
        }
        .github-btn:hover {
            background: #00FF85;
            border-color: #00FF85;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 133, 0.4);
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: #666;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .app-icon {
                width: 90px;
                height: 90px;
                border-radius: 22px;
                padding: 10px;
                margin-bottom: 15px;
            }
            .logo-text { font-size: 3rem; }
            .text-log { margin-left: 8px; }
            .title { font-size: 1.3rem; }
            .subtitle { font-size: 0.95rem; }
            .github-btn { padding: 12px 0; font-size: 0.9rem; width: 260px; }
            .download-btn { padding: 12px 0; font-size: 0.9rem; width: 260px; }
            .lang-switch { top: 20px; right: 20px; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <button class="lang-switch" onclick="switchLanguage()" id="langBtn">EN / 中</button>

    <div class="logo-container">
        <img src="assets/logo.svg" alt="RefLog App Icon" class="app-icon">

        <div class="logo-text">
            <span class="text-ref">Ref</span><span class="text-eree">eree</span><span class="text-log">Log</span>
        </div>
    </div>

    <div class="content-wrapper" id="content">
        <div class="title" id="mainTitle">足球裁判计时器</div>
        <div class="subtitle" id="subTitle">为 Wear OS 打造 · 重塑腕间执裁体验</div>
        
        <a href="downloads/RefLog_WearOS.apk" class="download-btn" id="downloadBtn" download>
            下载 Wear OS 版本
        </a>
        <a href="https://github.com/sLingli/RefLog" class="github-btn" id="actionBtn">
            访问 GitHub 项目仓库
        </a>
    </div>

    <div class="footer">Designed by sLingli</div>

    <script>
        const content = {
            cn: {
                mainTitle: "足球裁判计时器",
                subTitle: "为 Wear OS 打造 · 重塑腕间执裁体验",
                downloadBtn: "下载 Wear OS 版本",
                actionBtn: "访问 GitHub 项目仓库",
                langBtnText: "English"
            },
            en: {
                mainTitle: "Professional Match Timer",
                subTitle: "Designed for Wear OS. Simple, Precise, Reliable.",
                downloadBtn: "Download for Wear OS",
                actionBtn: "View on GitHub",
                langBtnText: "中文"
            }
        };

        let isChinese = true;

        function switchLanguage() {
            const wrapper = document.getElementById('content');
            const langBtn = document.getElementById('langBtn');

            wrapper.classList.add('fade-out');

            setTimeout(() => {
                isChinese = !isChinese;
                const data = isChinese ? content.cn : content.en;

                document.getElementById('mainTitle').innerText = data.mainTitle;
                document.getElementById('subTitle').innerText = data.subTitle;
                document.getElementById('downloadBtn').innerText = data.downloadBtn;
                document.getElementById('actionBtn').innerText = data.actionBtn;
                langBtn.innerText = data.langBtnText;

                wrapper.classList.remove('fade-out');
            }, 300);
        }
    </script>
</body>
</html>
